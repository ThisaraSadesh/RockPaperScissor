<!doctype html>
<html lang="en">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    #status {
      margin-top: 20px;
      font-size: 1.2em;
      color: #333;
    }
    .connected {
      color: #bb1f1f;
    }

    #log {
      margin-top: 20px;
      width: 80%;
      height: 300px;
      border: 1px solid #ccc;
      background-color: #fff;
      overflow-y: scroll;
      padding: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Socket Tester</title>
  </head>
  <body>
    <div id="status">Connecting...</div>
    <div id="log">
      <form id="message-form">
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button id="sendButton">Send</button>
      </form>
    </div>
    <script>
      const statusDiv = document.getElementById("status");
      const socket = new WebSocket("ws://localhost:8080");

      socket.addEventListener("open", function (event) {
        statusDiv.textContent = "Connected to WebSocket server";
        statusDiv.classList.add("connected");
      });


        const form = document.getElementById("message-form");
        const messageInput = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");

        form.addEventListener("submit", function (event) {
          event.preventDefault(); 
          const message = messageInput.value;
          if (message) {
            socket.send(message);
            messageInput.value = ""; 
          }
        });


      const logDiv = document.getElementById("log");
      socket.addEventListener("message", function (event) {
        const message = document.createElement("div");
        message.textContent = `Message from server: ${event.data}`;
        logDiv.appendChild(message);
        logDiv.scrollTop = logDiv.scrollHeight; 
      });

      socket.addEventListener("close", function (event) {
        statusDiv.textContent = "Disconnected from WebSocket server";
        statusDiv.classList.remove("connected");
      });

      socket.addEventListener("error", function (event) {
        statusDiv.textContent = "Error connecting to WebSocket server";
        statusDiv.classList.remove("connected");
      });
    </script>
  </body>
</html>
